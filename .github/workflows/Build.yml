name: Build, Test, Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  Build-And-Test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - id: setup-environment
        uses: ./.github/actions/setup
        with:
          node-version: '22'
      - run: yarn bundle
      - run: yarn lint
      - run: yarn format:check
      - run: yarn test
      # packs and installs the tarballs, so it can only run against a completed bundle
      - run: yarn verify:types

  Build-And-Test-CSR:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - id: setup-environment
        uses: ./.github/actions/setup
        with:
          node-version: '22'
      - run: yarn build:csr
      - run: yarn lint:csr
      - run: yarn test:csr

  E2E-Test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - id: setup-environment
        uses: ./.github/actions/setup
        with:
          node-version: '22'
      - run: yarn bundle
      - run: yarn test:e2e
        env:
          CONFIDENCE_CLIENT_SECRET: ${{ secrets.CONFIDENCE_CLIENT_SECRET }}
